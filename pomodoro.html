<!DOCTYPE html>
<html>
<head>
    <title>Pomodoro Timer</title>
</head>
<body style="background-color: #fff0f5; font-family: sans-serif; text-align: center; color: palevioletred; padding: 50px;">

    <h1 id="timer-state" style="font-size: 3rem; margin-bottom: 10px;">FOCUS</h1>

    <div id="timer-display" style="font-size: 5rem; font-weight: bold; margin-bottom: 20px;">25:00</div>

    <div style="margin-bottom: 20px;">
        <label><b>Focus (min):</b></label>
        <input type="number" id="focus-input" value="25" style="width: 50px; color: palevioletred; border: 1px solid palevioletred; border-radius: 5px; padding: 5px; margin-right: 15px;">
        
        <label><b>Break (min):</b></label>
        <input type="number" id="break-input" value="5" style="width: 50px; color: palevioletred; border: 1px solid palevioletred; border-radius: 5px; padding: 5px;">
    </div>

    <div style="margin-bottom: 40px;">
        <input type="submit" id="start-btn" value="Start" style="background-color: palevioletred; color: white; border: none; padding: 10px 20px; font-size: 1.2rem; border-radius: 5px; cursor: pointer; margin: 5px;">
        <input type="submit" id="pause-btn" value="Pause" style="background-color: palevioletred; color: white; border: none; padding: 10px 20px; font-size: 1.2rem; border-radius: 5px; cursor: pointer; margin: 5px;">
        <input type="submit" id="reset-btn" value="Reset" style="background-color: white; color: palevioletred; border: 2px solid palevioletred; padding: 8px 18px; font-size: 1.2rem; border-radius: 5px; cursor: pointer; margin: 5px;">
    </div>

    <hr style="border: 1px solid palevioletred; width: 50%; margin: 0 auto 30px auto;">

    <h3>HISTORY FOR TODAY</h3>
    <div id="history-list" style="font-size: 1.1rem; line-height: 1.6;"></div>

    <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"></audio>

</body>
</html>
